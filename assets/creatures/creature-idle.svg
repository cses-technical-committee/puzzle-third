<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="novaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#63D9E8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#63D9E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Aura -->
  <circle cx="80" cy="85" r="55" fill="url(#novaGlow)" />

  <!-- Animated Floating Body Group -->
  <g class="nova-idle-float">
    <!-- Tail -->
    <path d="M 45,95 Q 20,80 25,60 Q 35,55 42,75 Z" fill="url(#bodyGrad)" opacity="0.9"/>
    <circle cx="27" cy="58" r="4" fill="#63D9E8" filter="url(#softGlow)"/>

    <!-- Left Ear -->
    <path d="M 50,45 Q 40,15 60,30 Z" fill="url(#bodyGrad)"/>
    <path d="M 52,40 Q 46,22 58,32 Z" fill="#63D9E8" opacity="0.8"/>

    <!-- Right Ear -->
    <path d="M 110,45 Q 120,15 100,30 Z" fill="url(#bodyGrad)"/>
    <path d="M 108,40 Q 114,22 102,32 Z" fill="#63D9E8" opacity="0.8"/>

    <!-- Main Body / Head (Sphere) -->
    <ellipse cx="80" cy="82" rx="42" ry="38" fill="url(#bodyGrad)"/>

    <!-- Belly Patch -->
    <ellipse cx="80" cy="94" rx="24" ry="18" fill="url(#bellyGrad)" opacity="0.9"/>

    <!-- Forehead Tech Crest (Glows with Wisdom) -->
    <polygon points="80,48 85,58 80,62 75,58" fill="#F5C66B" filter="url(#softGlow)"/>
    <circle cx="80" cy="55" r="2" fill="#FFFFFF"/>

    <!-- Eyes (Big, Expressive, Friendly) -->
    <!-- Left Eye -->
    <ellipse cx="66" cy="76" rx="7" ry="9" fill="#0F172A"/>
    <circle cx="68" cy="73" r="3.2" fill="#FFFFFF"/>
    <circle cx="64" cy="79" r="1.5" fill="#63D9E8"/>

    <!-- Right Eye -->
    <ellipse cx="94" cy="76" rx="7" ry="9" fill="#0F172A"/>
    <circle cx="96" cy="73" r="3.2" fill="#FFFFFF"/>
    <circle cx="92" cy="79" r="1.5" fill="#63D9E8"/>

    <!-- Cheeks (Blushing) -->
    <circle cx="56" cy="86" r="4" fill="#F472B6" opacity="0.5"/>
    <circle cx="104" cy="86" r="4" fill="#F472B6" opacity="0.5"/>

    <!-- Cute Smile -->
    <path d="M 75,85 Q 80,90 85,85" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

    <!-- Paws / Hands -->
    <circle cx="62" cy="102" r="5" fill="#63D9E8"/>
    <circle cx="98" cy="102" r="5" fill="#63D9E8"/>
  </g>
</svg>
