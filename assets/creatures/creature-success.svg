<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="succGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bellyGradS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="softGlowS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="60" fill="url(#succGlow)" />

  <g transform="translate(0, -6)">
    <!-- Swishing Joyous Tail -->
    <path d="M 45,95 Q 15,70 18,45 Q 30,42 38,65 Z" fill="url(#bodyGradS)"/>
    <circle cx="18" cy="45" r="5" fill="#F5C66B" filter="url(#softGlowS)"/>

    <!-- Happy Perked Ears -->
    <path d="M 48,45 Q 32,10 58,25 Z" fill="url(#bodyGradS)"/>
    <path d="M 50,40 Q 40,20 56,28 Z" fill="#6EE7B7" opacity="0.9"/>

    <path d="M 112,45 Q 128,10 102,25 Z" fill="url(#bodyGradS)"/>
    <path d="M 110,40 Q 120,20 104,28 Z" fill="#6EE7B7" opacity="0.9"/>

    <!-- Body in Joyful Hop -->
    <ellipse cx="80" cy="80" rx="42" ry="36" fill="url(#bodyGradS)"/>
    <ellipse cx="80" cy="90" rx="24" ry="18" fill="url(#bellyGradS)"/>

    <!-- Brilliant Glowing Crest -->
    <polygon points="80,44 86,56 80,60 74,56" fill="#F5C66B" filter="url(#softGlowS)"/>
    <circle cx="80" cy="52" r="2.5" fill="#FFFFFF"/>

    <!-- Happy Arched Eyes (^ ^) -->
    <path d="M 60,76 Q 67,66 74,76" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 86,76 Q 93,66 100,76" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Big Cheerful Blushes -->
    <circle cx="56" cy="84" r="5" fill="#F472B6" opacity="0.7"/>
    <circle cx="104" cy="84" r="5" fill="#F472B6" opacity="0.7"/>

    <!-- Wide Happy Open Mouth -->
    <path d="M 72,83 Q 80,95 88,83 Z" fill="#F43F5E"/>

    <!-- Joyful Raised Paws -->
    <circle cx="48" cy="72" r="6" fill="#6EE7B7" filter="url(#softGlowS)"/>
    <circle cx="112" cy="72" r="6" fill="#6EE7B7" filter="url(#softGlowS)"/>

    <!-- Sparkles -->
    <polygon points="32,25 35,32 42,35 35,38 32,45 29,38 22,35 29,32" fill="#F5C66B" filter="url(#softGlowS)"/>
    <polygon points="128,30 130,35 135,37 130,39 128,44 126,39 121,37 126,35" fill="#63D9E8" filter="url(#softGlowS)"/>
  </g>
</svg>
