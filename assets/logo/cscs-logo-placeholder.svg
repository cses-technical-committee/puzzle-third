<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="cscsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63D9E8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Background Hexagon -->
  <g transform="translate(10, 8)">
    <polygon points="32,2 58,18 58,46 32,62 6,46 6,18" fill="url(#shieldGrad)" stroke="url(#cscsGrad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Inner Cyber Circuit Lines -->
    <path d="M18,32 L26,32 L32,22 L40,22 L44,28" fill="none" stroke="#63D9E8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="44" cy="28" r="2.5" fill="#63D9E8"/>
    <path d="M22,40 L30,40 L34,44 L44,44" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="22" cy="40" r="2" fill="#8B5CF6"/>
    
    <!-- Central Node -->
    <circle cx="32" cy="32" r="5" fill="#F5C66B" filter="url(#glow)"/>
    <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(85, 26)">
    <!-- Main CSCS Acronym -->
    <text x="0" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#FFFFFF">
      CSCS
    </text>
    <!-- Secondary Subtitle -->
    <text x="2" y="38" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#94A3B8">
      COMPUTER SCIENCE &amp; CYBER SOCIETY
    </text>
  </g>

  <!-- Technical Division Line & Tag -->
  <line x1="225" y1="20" x2="225" y2="60" stroke="#334155" stroke-width="1.5"/>
  <rect x="235" y="25" width="75" height="20" rx="4" fill="#1E293B" stroke="#63D9E8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="272" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="800" letter-spacing="1.5" fill="#63D9E8" text-anchor="middle">
    OFFICIAL
  </text>
</svg>
